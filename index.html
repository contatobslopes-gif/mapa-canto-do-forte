<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matrimap 2.0 — Produtividade Imobiliária</title>
  
  <!-- Tailwind CSS para visual limpo e moderno -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS para o mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Configurações do Supabase -->
  <script src="supabase-config.js"></script>

  <style>
    #mapa { height: calc(100vh - 64px); }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900">

  <!-- Navegação Principal -->
  <nav class="bg-white border-b border-gray-200 h-16 flex items-center justify-between px-6 shadow-sm">
    <div class="flex items-center space-x-3">
      <div class="bg-blue-600 text-white font-bold p-2 rounded-lg text-xl tracking-wider">M</div>
      <span class="font-bold text-xl text-gray-800">MATRIMAP <span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full">2.0</span></span>
    </div>

    <!-- Barra de Pesquisa Híbrida (Busca Objetiva) -->
    <div class="flex-1 max-w-xl mx-6">
      <div class="relative">
        <input 
          type="text" 
          id="campoBusca"
          placeholder="Pesquisar por Matrícula, Endereço, Proprietário ou IPTU..." 
          class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
        <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>
    </div>

    <!-- Ações e Menu -->
    <div class="flex items-center space-x-3">
      <button 
        onclick="abrirModalNovoProjeto()" 
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center space-x-1 shadow-sm transition">
        <span>+ Novo Projeto</span>
      </button>
      <div id="statusAuth" class="text-xs bg-gray-100 border border-gray-300 text-gray-600 px-3 py-1.5 rounded-lg">
        Carregando...
      </div>
    </div>
  </nav>

  <!-- Painel Principal (Mapa + Sidebar do Imóvel) -->
  <div class="flex h-[calc(100vh-64px)] overflow-hidden">
    
    <!-- Mapa Leaflet (Exploração Espacial) -->
    <div class="flex-1 relative">
      <div id="mapa" class="w-full h-full"></div>
    </div>

    <!-- Sidebar de Detalhes do Projeto do Imóvel -->
    <div id="sidebarImovel" class="w-96 bg-white border-l border-gray-200 p-6 overflow-y-auto hidden shadow-lg">
      <div class="flex justify-between items-start mb-4 border-b pb-3">
        <div>
          <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">Projeto do Imóvel</span>
          <h2 id="sideTitulo" class="text-xl font-bold text-gray-800">Selecione um imóvel</h2>
        </div>
        <button onclick="fecharSidebar()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="text-xs font-medium text-gray-500 uppercase">Matrícula</label>
          <p id="sideMatricula" class="text-sm font-semibold text-gray-800">-</p>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 uppercase">Cartório</label>
          <p id="sideCartorio" class="text-sm text-gray-800">-</p>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 uppercase">Inscrição IPTU</label>
          <p id="sideIPTU" class="text-sm text-gray-800">-</p>
        </div>
        <div>
          <label class="text-xs font-medium text-gray-500 uppercase">Endereço Completo</label>
          <p id="sideEndereco" class="text-sm text-gray-800">-</p>
        </div>

        <hr class="my-4 border-gray-200" />

        <!-- Botões de Ação do Cofre Privado -->
        <div class="space-y-2">
          <button onclick="alert('Módulo de Conferência em construção!')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm flex items-center justify-center space-x-2">
            <span>🔎 Iniciar Conferência</span>
          </button>
          <button onclick="alert('Módulo de Atos da Matrícula em construção!')" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-medium py-2 rounded-lg text-sm flex items-center justify-center space-x-2">
            <span>📄 Ver Atos & Gravames</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal do "+ Novo Projeto" (Cofre Privado) -->
  <div id="modalNovoProjeto" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-2xl w-full max-w-lg p-6 relative">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="text-lg font-bold text-gray-800">Cadastrar Novo Projeto de Imóvel</h3>
        <button onclick="fecharModalNovoProjeto()" class="text-gray-400 hover:text-gray-600 text-xl font-bold">&times;</button>
      </div>

      <form id="formNovoProjeto" onsubmit="salvarNovoProjeto(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Nome do Projeto *</label>
          <input type="text" id="inputNomeProjeto" required placeholder="Ex: Terreno João Silva" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Nº da Matrícula</label>
            <input type="text" id="inputMatricula" placeholder="Ex: 12.345" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Inscrição IPTU</label>
            <input type="text" id="inputIPTU" placeholder="Ex: 01.02.003" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-700 mb-1">Endereço Completo</label>
          <input type="text" id="inputEndereco" placeholder="Ex: Rua Armando Salles de Oliveira, Leme/SP" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Latitude</label>
            <input type="number" step="any" id="inputLat" placeholder="-22.1856" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-700 mb-1">Longitude</label>
            <input type="number" step="any" id="inputLng" placeholder="-47.3889" class="w-full border border-gray-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" />
          </div>
        </div>

        <div class="flex justify-end space-x-3 pt-3 border-t">
          <button type="button" onclick="fecharModalNovoProjeto()" class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-700 hover:bg-gray-50">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">Salvar Projeto</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lógica Principal da Aplicação -->
  <script>
    let map;
    let marcadores = [];

    // 1. Inicializar o Mapa Leaflet
    function inicializarMapa() {
      // Coordenadas padrão centralizadas em Leme/SP
      map = L.map('mapa').setView([-22.1856, -47.3889], 14);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap / Matrimap 2.0'
      }).addTo(map);

      carregarImoveisDoBanco();
    }

    // 2. Carregar Imóveis da Base do Supabase
    async function carregarImoveisDoBanco() {
      if (typeof supabaseClient === 'undefined') return;

      const { data, error } = await supabaseClient
        .from('base_imoveis_mapa')
        .select('*');

      if (error) {
        console.error("Erro ao carregar mapa:", error);
        return;
      }

      if (data && data.length > 0) {
        data.forEach(imovel => {
          if (imovel.latitude && imovel.longitude) {
            const marker = L.marker([imovel.latitude, imovel.longitude])
              .addTo(map)
              .bindPopup(`<b>Matrícula ${imovel.matricula_numero}</b><br>${imovel.endereco_completo || ''}`);

            marker.on('click', () => abrirSidebarImovel(imovel));
            marcadores.push(marker);
          }
        });
      }
    }

    // 3. Funções da Sidebar de Detalhes
    function abrirSidebarImovel(imovel) {
      document.getElementById('sideTitulo').innerText = `Matrícula ${imovel.matricula_numero || '-'}`;
      document.getElementById('sideMatricula').innerText = imovel.matricula_numero || '-';
      document.getElementById('sideCartorio').innerText = imovel.cartorio_nome || '-';
      document.getElementById('sideIPTU').innerText = imovel.inscricao_iptu || '-';
      document.getElementById('sideEndereco').innerText = imovel.endereco_completo || '-';

      document.getElementById('sidebarImovel').classList.remove('hidden');
    }

    function fecharSidebar() {
      document.getElementById('sidebarImovel').classList.add('hidden');
    }

    // 4. Funções do Modal
    function abrirModalNovoProjeto() {
      document.getElementById('modalNovoProjeto').classList.remove('hidden');
    }

    function fecharModalNovoProjeto() {
      document.getElementById('modalNovoProjeto').classList.add('hidden');
    }

    // 5. Salvar Projeto Privado no Supabase
    async function salvarNovoProjeto(event) {
      event.preventDefault();

      const novoProjeto = {
        nome_projeto: document.getElementById('inputNomeProjeto').value,
        matricula_numero: document.getElementById('inputMatricula').value,
        inscricao_iptu: document.getElementById('inputIPTU').value,
        endereco_completo: document.getElementById('inputEndereco').value,
        latitude: parseFloat(document.getElementById('inputLat').value) || null,
        longitude: parseFloat(document.getElementById('inputLng').value) || null
      };

      const { data, error } = await supabaseClient
        .from('projetos_imoveis')
        .insert([novoProjeto]);

      if (error) {
        alert("Erro ao salvar projeto: " + error.message);
      } else {
        alert("Projeto criado com sucesso no seu cofre privado!");
        fecharModalNovoProjeto();
        document.getElementById('formNovoProjeto').reset();
      }
    }

    // Inicialização ao carregar a página
    window.onload = () => {
      inicializarMapa();
      document.getElementById('statusAuth').innerText = "Conectado ao Supabase ✓";
    };
  </script>
</body>
</html>
